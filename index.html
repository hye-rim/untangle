<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>줄 풀기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #ff8fb3 0%, #c76bff 55%, #6b5cff 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #col { width:min(100%, 460px); display:flex; flex-direction:column; align-items:center; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:19px; }
  #hud .item.bad .value { color:#e63946; }
  #hud .item.good .value { color:#1f9d4a; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #wrap { position:relative; width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #boardBox { position:relative; width:min(100%, calc(100dvh - 190px)); aspect-ratio:1; background:#fff6dc; border:4px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); overflow:hidden; }
  #board { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #msg { min-height:22px; font-size:15px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; }
  #tools { display:flex; gap:8px; width:100%; justify-content:center; flex-wrap:wrap; }
  #tools button { font:inherit; font-size:16px; color:var(--ink); background:var(--yellow); border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); padding:6px 14px; cursor:pointer; }
  #tools button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #tools button:disabled { opacity:.45; cursor:default; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.78); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .stars { font-size:34px; letter-spacing:4px; }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; color:#fff; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:#d9c9ff; text-align:right; }
  #overlay .stats dd { text-align:left; }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    #wrap { gap:8px; }
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; }
    #overlay p { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="label">단계</span><span class="value" id="lvl">1</span></div>
      <div class="item" id="crossBox"><span class="label">겹침</span><span class="value" id="crossN">0</span></div>
      <div class="item"><span class="label">이동</span><span class="value" id="movesN">0</span></div>
      <div class="icons"><button id="muteBtn" title="소리 (M)">🔊</button></div>
    </div>
    <div id="wrap">
      <div id="boardBox">
        <canvas id="board"></canvas>
        <div id="overlay"></div>
      </div>
      <div id="msg"></div>
      <div id="tools"><button id="undoBtn">↩ 되돌리기</button><button id="restartBtn">🔄 다시</button><button id="hintBtn">💡 힌트</button></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
